        :root { 
            --primary: #FFFFFF; 
            --primary-hover: #E4E4E7;
            --bg-dark: #000000;
            --ease-out-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-in-out-smooth: cubic-bezier(0.65, 0, 0.35, 1);
            --spring-smooth: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #ffffff; 
            overflow: hidden; 
            user-select: none; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            font-family: 'Plus Jakarta Sans', 'Prompt', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        } 
        
        img { 
            -webkit-user-drag: none; 
            user-drag: none; 
            pointer-events: none; 
        } 
        
        /* Ultra-Smooth Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
            transition: background 0.4s var(--ease-out-smooth);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Smooth Glass Panels */
        .glass-panel {
            background: rgba(12, 12, 12, 0.82);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            transition: border-color 0.4s var(--ease-out-smooth), box-shadow 0.4s var(--ease-out-smooth);
        }

        .glass-header {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: background-color 0.5s var(--ease-out-smooth), border-color 0.5s var(--ease-out-smooth);
        }

        /* Enhanced Card Hover (Soft & Fluid) */
        .card-hover {
            transition: transform 0.4s var(--ease-out-smooth), box-shadow 0.4s var(--ease-out-smooth), border-color 0.4s var(--ease-out-smooth);
            will-change: transform;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.25) !important;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }
        .card-hover:active {
            transform: scale(0.98);
            transition: transform 0.1s ease;
        }

        /* Silky Smooth Hero Slider Transitions */
        .slide-item {
            transition: opacity 1.2s var(--ease-out-smooth), transform 1.2s var(--ease-out-smooth);
            will-change: opacity, transform;
            transform: scale(1.02);
        }
        .slide-item.opacity-100 {
            transform: scale(1);
        }

        /* Smooth Modal Display with Gentle Fade & Scale */
        .modal-animated {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.4s var(--ease-out-smooth), visibility 0.4s var(--ease-out-smooth);
        }
        .modal-animated.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Dynamic Navigation Buttons */
        .hdr-cat-btn, .cat-btn {
            transition: all 0.3s var(--ease-out-smooth);
        }

        /* Smooth Swipe Target */
        .swipe-target {
            touch-action: pan-y;
        }

        /* Shimmer Loading Effect */
        @keyframes skeleton-shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .skeleton-shimmer {
            background: linear-gradient(
                90deg, 
                rgba(255, 255, 255, 0.03) 25%, 
                rgba(255, 255, 255, 0.09) 50%, 
                rgba(255, 255, 255, 0.03) 75%
            );
            background-size: 200% 100%;
            animation: skeleton-shimmer 2s infinite ease-in-out;
        }

        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 20px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    </style>

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function updateSlideUI() {
            const slides = document.querySelectorAll('.slide-item');
            const dots = document.querySelectorAll('.dot-btn');

            slides.forEach((slide, idx) => {
                if (idx === STATE.currentSlide) {
                    slide.classList.remove('opacity-0', 'z-0', 'pointer-events-none');
                    slide.classList.add('opacity-100', 'z-10', 'pointer-events-auto');
                } else {
                    slide.classList.remove('opacity-100', 'z-10', 'pointer-events-auto');
                    slide.classList.add('opacity-0', 'z-0', 'pointer-events-none');
                }
            });

            dots.forEach((dot, idx) => {
                if (idx === STATE.currentSlide) {
                    dot.classList.remove('w-2', 'bg-white/30');
                    dot.classList.add('w-6', 'bg-white');
                } else {
                    dot.classList.remove('w-6', 'bg-white');
                    dot.classList.add('w-2', 'bg-white/30');
                }
            });
        }

        function moveSlide(direction) {
            clearInterval(STATE.sliderInterval);
            STATE.currentSlide = (STATE.currentSlide + direction + STATE.featuredItems.length) % STATE.featuredItems.length;
            updateSlideUI();
            startSliderAutoPlay();
        }

        function goToSlide(index) {
            clearInterval(STATE.sliderInterval);
            STATE.currentSlide = index;
            updateSlideUI();
            startSliderAutoPlay();
        }

        function startSliderAutoPlay() {
            clearInterval(STATE.sliderInterval);
            STATE.sliderInterval = setInterval(() => {
                STATE.currentSlide = (STATE.currentSlide + 1) % STATE.featuredItems.length;
                updateSlideUI();
            }, 6000);
        }

        function setupSwipeGestures() {
            const container = document.getElementById('hero-slider-container');
            if(!container) return;

            let touchStartX = 0;
            let touchEndX = 0;

            container.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            container.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            function handleSwipe() {
                const diff = touchStartX - touchEndX;
                if (Math.abs(diff) > 40) {
                    if (diff > 0) moveSlide(1);
                    else moveSlide(-1);
                }
            }
        }

        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

            STATE.currentPlayingUrl = url;

            document.querySelectorAll('.ep-btn').forEach(btn => {
                btn.className = 'ep-btn w-full p-3 bg-surface-100 hover:bg-surface-200 border border-white/5 rounded-xl text-left text-xs sm:text-sm font-medium text-zinc-300 transition-all duration-300 flex items-center justify-between group active:scale-[0.98]';
            });
            if(btnElement) {
                btnElement.className = 'ep-btn w-full p-3 bg-white/10 border-white/30 text-white font-semibold rounded-xl text-left text-xs sm:text-sm transition-all duration-300 flex items-center justify-between group shadow-lg active:scale-[0.98]';
            }

            const ytContainer = document.getElementById('yt-player-container');
            const stdPlayer = document.getElementById('std-player');
            
            showStatusOverlay();

            if (streamTimeout) clearTimeout(streamTimeout);
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            if(url.includes('youtube.com') || url.includes('youtu.be')) {
                stdPlayer.classList.add('hidden');
                stdPlayer.pause();
                ytContainer.classList.remove('hidden');
                
                let videoId = '';
                if (url.includes('youtu.be')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0];
                } else if (url.includes('youtube.com')) {
                    videoId = url.split('v=')[1].split('&')[0];
                }

                ytContainer.innerHTML = `<iframe class="w-full h-full border-0" src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen onload="hideStatusOverlay()"></iframe>`;
                
                streamTimeout = setTimeout(() => {
                    hideStatusOverlay();
                }, 1500);

            } else {
                ytContainer.classList.add('hidden');
                ytContainer.innerHTML = '';
                stdPlayer.classList.remove('hidden');

                const handlePlaying = () => {
                    hideStatusOverlay();
                    stdPlayer.removeEventListener('playing', handlePlaying);
                    stdPlayer.removeEventListener('loadeddata', handlePlaying);
                };

                stdPlayer.addEventListener('playing', handlePlaying);
                stdPlayer.addEventListener('loadeddata', handlePlaying);

                if (url.includes('.m3u8') && Hls.isSupported()) {
                    hlsInstance = new Hls({ enableWorker: true });
                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(stdPlayer);
                    
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                        stdPlayer.play().catch(() => {});
                    });

                    hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            showStatusOverlay();
                        }
                    });
                } else {
                    stdPlayer.src = url;
                    stdPlayer.play().catch(() => {});
                }

                stdPlayer.onerror = () => {
                    showStatusOverlay();
                };

                streamTimeout = setTimeout(() => {
                    if (stdPlayer.paused || stdPlayer.readyState < 2) {
                        showStatusOverlay();
                    }
                }, 8000);
            }
        }

        function closeVideo() {
            const modal = document.getElementById('video-modal');
            modal.classList.remove('active');

            if (streamTimeout) clearTimeout(streamTimeout);
            
            setTimeout(() => {
                document.getElementById('yt-player-container').innerHTML = '';
                const stdPlayer = document.getElementById('std-player');
                stdPlayer.pause();
                stdPlayer.src = '';

                if (hlsInstance) {
                    hlsInstance.destroy();
                    hlsInstance = null;
                }
            }, 400);
        }

        window.onload = () => {
            renderHeroSkeleton();
            renderGridSkeleton();

            setTimeout(() => {
                initHeroSlider();
                renderGrid();
                STATE.isLoading = false;
            }, 500);
        };
    </script>
</body>
</html>
